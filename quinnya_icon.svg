  <text x="200" y="240" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="178" font-weight="800" text-anchor="middle" fill="white" letter-spacing="-4" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;system-ui&quot;, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, sans-serif;font-size:178px;font-weight:800;text-anchor:middle;dominant-baseline:auto">Q</text>

