  <text x="200" y="354" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="white" letter-spacing="6" opacity="0.9" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.9;font-family:-apple-system, &quot;system-ui&quot;, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, sans-serif;font-size:28px;font-weight:600;text-anchor:middle;dominant-baseline:auto">QUINNYA</text>
</svg>